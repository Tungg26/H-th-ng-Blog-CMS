services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: '--default-authentication-plugin=mysql_native_password'
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://localhost/pma/
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net

volumes:
  db_data:

networks:
  frontend_net:
  backend_net: